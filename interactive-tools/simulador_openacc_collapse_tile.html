<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">OpenACC: collapse e tile na Multiplicação de Matrizes</title>
  <style>
    :root{--bg:#f1f5f9;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--blue:#2563eb;--green:#166534;--greenbg:#dcfce7;--orange:#9a3412;--orangebg:#ffedd5;--shadow:0 12px 34px rgba(15,23,42,.08)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(135deg,#f8fafc,var(--bg));font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .app{width:min(1180px,calc(100% - 28px));margin:24px auto}header{text-align:center;margin-bottom:18px}h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.2rem)}h2{margin:0;font-size:1.08rem}p{margin:0}.muted,.subtitle{color:var(--muted)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs .active{background:var(--blue);color:#fff}
    button{min-height:40px;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700;color:#334155;background:#e2e8f0}button.primary{background:var(--blue);color:#fff}
    .controls{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:13px;align-items:end}.conditional{display:contents}.hidden{display:none!important}label{display:grid;gap:6px;color:#334155;font-size:.86rem;font-weight:650}input,select{width:100%;min-height:40px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);padding:7px 9px}.actions{display:flex;gap:7px;grid-column:span 2}.actions .primary{flex:1}
    .code{margin-top:16px;padding:13px 15px;border-radius:10px;background:#0f172a;color:#e2e8f0;font:600 .82rem ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.pragma{color:#7dd3fc}.kw{color:#c4b5fd}.comment{color:#94a3b8}
    .status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.badge{border-radius:999px;padding:5px 10px;font-size:.77rem;font-weight:750}.safe{background:var(--greenbg);color:var(--green)}.risk{background:var(--orangebg);color:var(--orange)}.explain{color:var(--muted);font-size:.88rem;flex:1;min-width:220px}
    .legend{display:flex;gap:10px 16px;flex-wrap:wrap;margin:10px 0 16px}.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:#475569}.swatch{width:13px;height:13px;border-radius:4px}
    .workspace{display:grid;grid-template-columns:minmax(330px,1fr) minmax(250px,.58fr);gap:22px;align-items:start}.head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:10px}.head small{color:var(--muted)}.matrix{display:grid;gap:5px}
    .cell{min-width:0;aspect-ratio:1.18;border:0;border-radius:7px;color:#fff;padding:3px;display:grid;place-items:center;position:relative;font-size:.72rem;font-weight:800;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .15s,opacity .15s}.cell:hover,.cell.selected{transform:translateY(-2px);box-shadow:0 0 0 3px #0f172a}.cell.pending{opacity:.14}.cell small{font-size:.58rem}.cell.race:after{content:"!";position:absolute;right:3px;top:2px;background:#fff;color:var(--orange);width:15px;height:15px;border-radius:50%;display:grid;place-items:center}
    .detail{border-left:1px solid var(--line);padding-left:20px}.klist{display:grid;gap:7px;margin-top:12px}.krow{display:grid;grid-template-columns:32px 1fr 54px;gap:7px;align-items:center;font-size:.74rem}.bar{height:20px;border-radius:5px}.tuple{font:700 .77rem ui-monospace,monospace}.note{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);color:#475569;font-size:.82rem;line-height:1.45}
    @media(max-width:820px){.controls{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.detail{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.actions{grid-column:span 2}}@media(max-width:470px){.app{width:calc(100% - 16px);margin:8px auto}.panel{padding:14px}.controls{grid-template-columns:1fr}.actions{grid-column:auto;flex-wrap:wrap}}
    .language-switch{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-bottom:12px}.language-switch button{font-size:.85rem}.language-switch button.active{background:#2563eb;color:#fff}
  </style>
</head>
<body>
<main class="app">
  <div class="language-switch" role="group" aria-label="Idioma" data-i18n-aria="language">
    <button type="button" data-lang="pt" lang="pt-BR" title="Português" aria-pressed="true" class="active">🇧🇷 Português</button>
    <button type="button" data-lang="es" lang="es" title="Español" aria-pressed="false">🇪🇸 Español</button>
    <button type="button" data-lang="en" lang="en" title="English" aria-pressed="false">🇺🇸 English</button>
  </div>
  <header><h1><span data-i18n="heading">Multiplicação de matrizes com OpenACC</span></h1><p class="subtitle"><code>A(M×N) × B(N×N) → C(M×N)</code><span data-i18n="subtitle"> — distribuição didática entre gangs</span></p></header>
  <section class="panel">
    <div class="tabs"><button id="collapseMode" class="active" type="button">loop collapse</button><button id="tileMode" type="button">loop tile</button></div>
    <div class="controls">
      <label><span data-i18n="rows">Linhas de A e C (M)</span><input id="mInput" type="number" min="1" max="12" value="6"></label>
      <label><span data-i18n="columnsShort">Colunas (N)</span><input id="nInput" type="number" min="1" max="12" value="8"></label>
      <label><span data-i18n="gangs">Número de gangs</span><input id="gangsInput" type="number" min="1" max="8" value="4"></label>
      <div id="collapseControls" class="conditional"><label><span data-i18n="collapseLevel">Nível de collapse</span><select id="collapseInput"><option value="1">1 — i</option><option value="2" selected>2 — i,j</option><option value="3">3 — i,j,k</option></select></label></div>
      <div id="tileControls" class="conditional hidden">
        <label><span data-i18n="tiledLoops">Laços ladrilhados</span><select id="depthInput"><option value="1">1 — i</option><option value="2" selected>2 — i,j</option><option value="3">3 — i,j,k</option></select></label>
        <label>Tile i<input id="tiInput" type="number" min="1" max="6" value="2"></label>
        <label id="tjLabel">Tile j<input id="tjInput" type="number" min="1" max="8" value="3"></label>
        <label id="tkLabel" class="hidden">Tile k<input id="tkInput" type="number" min="1" max="8" value="2"></label>
      </div>
      <div class="actions"><button id="playButton" class="primary" type="button"><span data-i18n="play">▶ Animar</span></button><button id="stepButton" type="button"><span data-i18n="step">Passo →</span></button><button id="resetButton" type="button"><span data-i18n="reset">Reiniciar</span></button></div>
    </div>
    <div id="code" class="code"></div>
  </section>
  <section class="panel">
    <div class="status"><span id="badge" class="badge safe"></span><p id="explanation" class="explain"></p></div>
    <div id="legend" class="legend"></div>
    <div class="workspace">
      <div><div class="head"><h2><span data-i18n="matrix">Matriz de resultado C</span></h2><small id="progress"></small></div><div id="matrix" class="matrix"></div></div>
      <aside class="detail"><div class="head"><h2 id="detailTitle"></h2><small><span data-i18n="products">produtos no laço k</span></small></div><p id="detailSummary" class="muted"></p><div id="klist" class="klist"></div></aside>
    </div>
    <p id="note" class="note"></p>
  </section>
</main>
<script>
(()=>{
  "use strict";
  const translations = {
  "pt": {
    "rows": "Linhas de A e C (M)",
    "columnsShort": "Colunas (N)",
    "gangs": "Número de gangs",
    "collapseLevel": "Nível de collapse",
    "tiledLoops": "Laços ladrilhados",
    "play": "▶ Animar",
    "stop": "■ Parar",
    "step": "Passo →",
    "reset": "Reiniciar",
    "matrix": "Matriz de resultado C",
    "products": "produtos no laço k",
    "dependency": "Dependência entre iterações",
    "independent": "Iterações independentes",
    "accRisk": "Gangs diferentes podem atualizar o mesmo C[i][j]. O += naive precisa de redução, atomicidade ou outra reorganização.",
    "accSafe": "Cada C[i][j] é calculado integralmente por um único gang nesta abstração.",
    "accCode": "Em OpenACC, o primeiro tamanho corresponde ao laço associado mais interno.",
    "accK": "collapse(3) separa parcelas da mesma soma e viola a independência exigida pelo loop paralelo naive.",
    "accTileK": " Ao incluir k, tiles diferentes podem atualizar o mesmo elemento C.",
    "progress": "{0} de {1} unidades",
    "accDetailOne": "As {0} parcelas pertencem ao gang {1}.",
    "accDetailMany": "As parcelas foram divididas entre {0} gangs.",
    "accCollapseNote": "collapse({0}) associa {1} laço(s) fortemente aninhado(s) à diretiva loop; suas iterações são escalonadas de acordo com a cláusula gang. ",
    "accTileNote": "tile({0}) divide {1} laço(s) em laços externos de tiles e laços internos de elementos. A cláusula gang aplica-se aos laços externos de tiles.",
    "title": "OpenACC: collapse e tile na Multiplicação de Matrizes",
    "heading": "Multiplicação de matrizes com OpenACC",
    "subtitle": " — distribuição didática entre gangs",
    "language": "Idioma"
  },
  "en": {
    "rows": "Rows of A and C (M)",
    "columnsShort": "Columns (N)",
    "gangs": "Number of gangs",
    "collapseLevel": "Collapse level",
    "tiledLoops": "Tiled loops",
    "play": "▶ Animate",
    "stop": "■ Stop",
    "step": "Step →",
    "reset": "Reset",
    "matrix": "Result matrix C",
    "products": "products in loop k",
    "dependency": "Dependency between iterations",
    "independent": "Independent iterations",
    "accRisk": "Different gangs may update the same C[i][j]. The naive += requires a reduction, atomicity or another reorganization.",
    "accSafe": "Each C[i][j] is computed entirely by a single gang in this abstraction.",
    "accCode": "In OpenACC, the first size corresponds to the innermost associated loop.",
    "accK": "collapse(3) separates terms of the same sum and violates the independence required by the naive parallel loop.",
    "accTileK": " When k is included, different tiles may update the same element of C.",
    "progress": "{0} of {1} units",
    "accDetailOne": "The {0} terms belong to gang {1}.",
    "accDetailMany": "The terms were divided among {0} gangs.",
    "accCollapseNote": "collapse({0}) associates {1} tightly nested loop(s) with the loop directive; their iterations are scheduled according to the gang clause. ",
    "accTileNote": "tile({0}) splits {1} loop(s) into outer tile loops and inner element loops. The gang clause applies to the outer tile loops.",
    "title": "OpenACC: collapse and tile in Matrix Multiplication",
    "heading": "Matrix multiplication with OpenACC",
    "subtitle": " — educational work distribution among gangs",
    "language": "Language"
  },
  "es": {
    "rows": "Filas de A y C (M)",
    "columnsShort": "Columnas (N)",
    "gangs": "Número de gangs",
    "collapseLevel": "Nivel de collapse",
    "tiledLoops": "Bucles divididos en tiles",
    "play": "▶ Animar",
    "stop": "■ Detener",
    "step": "Paso →",
    "reset": "Reiniciar",
    "matrix": "Matriz de resultado C",
    "products": "productos en el bucle k",
    "dependency": "Dependencia entre iteraciones",
    "independent": "Iteraciones independientes",
    "accRisk": "Gangs diferentes pueden actualizar el mismo C[i][j]. El += naive requiere una reducción, atomicidad u otra reorganización.",
    "accSafe": "Cada C[i][j] es calculado íntegramente por un único gang en esta abstracción.",
    "accCode": "En OpenACC, el primer tamaño corresponde al bucle asociado más interno.",
    "accK": "collapse(3) separa términos de la misma suma y viola la independencia requerida por el bucle paralelo naive.",
    "accTileK": " Al incluir k, tiles diferentes pueden actualizar el mismo elemento de C.",
    "progress": "{0} de {1} unidades",
    "accDetailOne": "Los {0} términos pertenecen al gang {1}.",
    "accDetailMany": "Los términos se dividieron entre {0} gangs.",
    "accCollapseNote": "collapse({0}) asocia {1} bucle(s) estrechamente anidado(s) a la directiva loop; sus iteraciones se planifican según la cláusula gang. ",
    "accTileNote": "tile({0}) divide {1} bucle(s) en bucles externos de tiles y bucles internos de elementos. La cláusula gang se aplica a los bucles externos de tiles.",
    "title": "OpenACC: collapse y tile en la Multiplicación de Matrices",
    "heading": "Multiplicación de matrices con OpenACC",
    "subtitle": " — distribución didáctica entre gangs",
    "language": "Idioma"
  }
};
  let lang = "pt";
  function translate(key, values = []) {
    return translations[lang][key].replace(/\{(\d+)\}/g, (_, index) => values[Number(index)]);
  }
  function applyLanguage() {
    document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = translate(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", translate(el.dataset.i18nAria)));
    document.querySelectorAll("[data-lang]").forEach(button => {
      const active = button.dataset.lang === lang;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
  }
  document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click", () => {
    if (lang === button.dataset.lang) return;
    lang = button.dataset.lang;
    applyLanguage();
    render(false);
  }));
  applyLanguage();

  const $=id=>document.getElementById(id),colors=["#2563eb","#dc2626","#059669","#d97706","#7c3aed","#db2777","#0891b2","#ea580c"];
  const S={mode:"collapse",visible:Infinity,timer:null,selected:[0,0],units:[],owners:[]};
  const I={m:$("mInput"),n:$("nInput"),g:$("gangsInput"),c:$("collapseInput"),d:$("depthInput"),ti:$("tiInput"),tj:$("tjInput"),tk:$("tkInput")};
  function value(el,min,max,fallback){let v=parseInt(el.value,10);v=Number.isFinite(v)?Math.max(min,Math.min(max,v)):fallback;el.value=v;return v}
  function params(){const m=value(I.m,1,12,6),n=value(I.n,1,12,8),g=value(I.g,1,8,4);I.ti.max=m;I.tj.max=n;I.tk.max=n;return{m,n,g,c:+I.c.value,d:+I.d.value,ti:value(I.ti,1,m,2),tj:value(I.tj,1,n,3),tk:value(I.tk,1,n,2)}}
  function distribute(count,g){const a=[];for(let q=0;q<count;q++)a.push(q%g);return a}
  function build(p){const u=[];
    if(S.mode==="collapse"){
      if(p.c===1)for(let i=0;i<p.m;i++)u.push({pts:Array.from({length:p.n*p.n},(_,q)=>[i,Math.floor(q/p.n),q%p.n])});
      if(p.c===2)for(let i=0;i<p.m;i++)for(let j=0;j<p.n;j++)u.push({pts:Array.from({length:p.n},(_,k)=>[i,j,k])});
      if(p.c===3)for(let i=0;i<p.m;i++)for(let j=0;j<p.n;j++)for(let k=0;k<p.n;k++)u.push({pts:[[i,j,k]]});
    }else{
      const di=p.ti,dj=p.d>1?p.tj:p.n,dk=p.d>2?p.tk:p.n;
      for(let ii=0;ii<p.m;ii+=di)for(let jj=0;jj<p.n;jj+=dj)for(let kk=0;kk<p.n;kk+=dk){const pts=[];for(let i=ii;i<Math.min(ii+di,p.m);i++)for(let j=jj;j<Math.min(jj+dj,p.n);j++)for(let k=kk;k<Math.min(kk+dk,p.n);k++)pts.push([i,j,k]);u.push({pts})}
    }
    const who=distribute(u.length,p.g),owners=Array.from({length:p.m},()=>Array.from({length:p.n},()=>Array(p.n).fill(-1)));u.forEach((x,q)=>x.pts.forEach(([i,j,k])=>owners[i][j][k]=who[q]));S.units=u;S.owners=owners;
  }
  const uniq=a=>[...new Set(a)],paint=a=>{const x=uniq(a);return x.length===1?colors[x[0]%colors.length]:`conic-gradient(${x.map((g,q)=>`${colors[g%colors.length]} ${q/x.length*100}% ${(q+1)/x.length*100}%`).join(",")})`};
  function lastUnit(i,j){let last=-1;S.units.forEach((u,q)=>{if(u.pts.some(x=>x[0]===i&&x[1]===j))last=q});return last}
  function stop(){if(S.timer!==null)clearInterval(S.timer);S.timer=null;$("playButton").textContent=translate("play")}
  function render(reset=true){stop();const p=params();build(p);if(reset){S.visible=S.units.length;S.selected=[Math.min(S.selected[0],p.m-1),Math.min(S.selected[1],p.n-1)]}
    $("collapseMode").classList.toggle("active",S.mode==="collapse");$("tileMode").classList.toggle("active",S.mode==="tile");$("collapseControls").classList.toggle("hidden",S.mode!=="collapse");$("tileControls").classList.toggle("hidden",S.mode!=="tile");$("tjLabel").classList.toggle("hidden",p.d<2);$("tkLabel").classList.toggle("hidden",p.d<3);
    const risk=S.mode==="collapse"?p.c===3:p.d===3;$("badge").className=`badge ${risk?"risk":"safe"}`;$("badge").textContent=risk?translate("dependency"):translate("independent");
    $("explanation").textContent=risk?translate("accRisk"):translate("accSafe");
    $("code").innerHTML=code(p);$("legend").innerHTML=Array.from({length:p.g},(_,g)=>`<span><i class="swatch" style="background:${colors[g%colors.length]}"></i>Gang ${g}</span>`).join("");
    $("matrix").style.gridTemplateColumns=`repeat(${p.n},minmax(28px,1fr))`;$("matrix").replaceChildren(...Array.from({length:p.m*p.n},(_,q)=>cell(p,Math.floor(q/p.n),q%p.n)));
    updateProgress(p);detail(p);$("note").textContent=note(p,risk);
  }
  function cell(p,i,j){const a=S.owners[i][j],many=uniq(a).length>1,b=document.createElement("button");b.type="button";b.className=`cell${lastUnit(i,j)>=S.visible?" pending":""}${many?" race":""}${S.selected[0]===i&&S.selected[1]===j?" selected":""}`;b.style.background=paint(a);b.innerHTML=`C<small>[${i},${j}]</small>`;b.onclick=()=>{S.selected=[i,j];[...$("matrix").children].forEach((x,q)=>x.classList.toggle("selected",Math.floor(q/p.n)===i&&q%p.n===j));detail(p)};return b}
  function detail(p){const[i,j]=S.selected,a=S.owners[i][j],g=uniq(a);$("detailTitle").textContent=`C[${i}][${j}]`;$("detailSummary").textContent=g.length===1?`${translate("accDetailOne", [p.n,g[0]])}`:`${translate("accDetailMany", [g.length])}`;$("klist").innerHTML=a.map((x,k)=>`<div class="krow"><span class="tuple">k=${k}</span><span class="bar" style="background:${colors[x%colors.length]}"></span><span>Gang ${x}</span></div>`).join("")}
  function code(p){const loops=`<span class="kw">for</span> (int i=0; i&lt;M; i++)\n  <span class="kw">for</span> (int j=0; j&lt;N; j++)\n    <span class="kw">for</span> (int k=0; k&lt;N; k++) C[i][j] += A[i][k]*B[k][j];`;if(S.mode==="collapse")return`<span class="pragma">#pragma acc parallel num_gangs(${p.g})</span>\n{\n  <span class="pragma">#pragma acc loop gang(static:1) collapse(${p.c})</span>\n  ${loops}\n}`;
    const sizes=[p.tk,p.tj,p.ti].slice(3-p.d).join(", ");return`<span class="pragma">#pragma acc parallel num_gangs(${p.g})</span>\n{\n  <span class="pragma">#pragma acc loop gang(static:1) tile(${sizes})</span>\n  ${loops}\n}\n<span class="comment">// ${translate("accCode")}</span>`}
  function note(p,risk){if(S.mode==="collapse")return`${translate("accCollapseNote", [p.c,p.c])}${risk?translate("accK"):""}`;return`${translate("accTileNote", [[p.tk,p.tj,p.ti].slice(3-p.d).join(", "),p.d])}${risk?translate("accTileK"):""}`}
  function updateProgress(p){[...$("matrix").children].forEach((b,q)=>b.classList.toggle("pending",lastUnit(Math.floor(q/p.n),q%p.n)>=S.visible));$("progress").textContent=`${translate("progress", [Math.min(S.visible,S.units.length),S.units.length])}`}
  function animate(){stop();S.visible=0;render(false);$("playButton").textContent=translate("stop");S.timer=setInterval(()=>{S.visible++;updateProgress(params());if(S.visible>=S.units.length)stop()},Math.max(65,Math.min(260,3200/S.units.length)))}
  function step(){stop();if(S.visible>=S.units.length)S.visible=0;S.visible++;updateProgress(params())}
  $("collapseMode").onclick=()=>{S.mode="collapse";render()};$("tileMode").onclick=()=>{S.mode="tile";render()};Object.values(I).forEach(x=>x.onchange=()=>render());$("playButton").onclick=()=>S.timer===null?animate():stop();$("stepButton").onclick=step;$("resetButton").onclick=()=>render();render();
})();
</script>
</body>
</html>
