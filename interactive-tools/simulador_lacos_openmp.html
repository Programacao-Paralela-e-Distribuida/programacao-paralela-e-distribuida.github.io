<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Simulador de Escalonamento OpenMP</title>
  <style>
    :root {
      --bg: #f1f5f9; --panel: #fff; --ink: #172033; --muted: #64748b;
      --line: #dbe3ee; --brand: #2563eb; --brand-dark: #1d4ed8;
      --ok-bg: #dcfce7; --ok: #166534; --warn-bg: #fef3c7; --warn: #92400e;
      --shadow: 0 12px 34px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); background: linear-gradient(135deg, #f8fafc, var(--bg));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .app { width: min(1180px, calc(100% - 28px)); margin: 24px auto; }
    header { text-align: center; margin-bottom: 18px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.55rem, 4vw, 2.25rem); }
    h2 { margin: 0; font-size: 1.12rem; }
    p { margin: 0; }
    .subtitle { color: var(--muted); }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px;
    }
    .controls { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 14px; align-items: end; }
    label { display: grid; gap: 7px; color: #334155; font-size: .88rem; font-weight: 650; }
    input, select {
      width: 100%; min-height: 42px; border: 1px solid #cbd5e1; border-radius: 9px;
      background: #fff; color: var(--ink); padding: 8px 10px;
    }
    .actions { display: flex; gap: 8px; }
    button {
      min-height: 42px; border: 0; border-radius: 9px; padding: 9px 14px;
      cursor: pointer; font-weight: 700; background: #e2e8f0; color: #334155;
    }
    button.primary { flex: 1; color: #fff; background: var(--brand); }
    button.primary:hover { background: var(--brand-dark); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .directive {
      margin-top: 16px; padding: 13px 15px; border-radius: 10px; background: #0f172a;
      color: #e2e8f0; font: 600 .9rem ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .pragma { color: #7dd3fc; }
    .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .badge { border-radius: 999px; padding: 5px 10px; font-size: .78rem; font-weight: 750; }
    .badge.unique { background: var(--ok-bg); color: var(--ok); }
    .badge.variable { background: var(--warn-bg); color: var(--warn); }
    .explain { color: var(--muted); font-size: .9rem; flex: 1; min-width: 220px; }
    .legend { display: flex; gap: 10px 16px; flex-wrap: wrap; margin: 12px 0 18px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: #475569; }
    .swatch { width: 14px; height: 14px; border-radius: 4px; }
    .iterations {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 7px;
      min-height: 58px;
    }
    .iteration {
      position: relative; min-height: 53px; border-radius: 9px; padding: 8px 5px;
      display: grid; place-items: center; color: #fff; font-weight: 800;
      transform: translateY(0); transition: transform .18s, opacity .18s;
    }
    .iteration.pending { opacity: .18; }
    .iteration.current { transform: translateY(-4px); box-shadow: 0 5px 0 #0f172a; }
    .iteration small { position: absolute; right: 5px; bottom: 3px; font-size: .62rem; font-weight: 700; opacity: .9; }
    .section-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 10px; }
    .section-head span { color: var(--muted); font-size: .82rem; }
    .lanes { display: grid; gap: 9px; }
    .lane { display: grid; grid-template-columns: 88px 1fr 42px; gap: 10px; align-items: center; }
    .thread { display: flex; align-items: center; gap: 7px; font-weight: 750; font-size: .86rem; }
    .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
    .lane-items {
      min-height: 42px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap;
      gap: 5px; align-items: center; padding: 4px 0;
    }
    .chip { min-width: 30px; padding: 5px 6px; border-radius: 6px; text-align: center; color: #fff; font: 700 .75rem ui-monospace, monospace; }
    .count { text-align: right; color: var(--muted); font-size: .82rem; }
    .note { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); color: #475569; font-size: .84rem; line-height: 1.45; }
    .empty { color: var(--muted); font-size: .85rem; }
    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .lane { grid-template-columns: 76px 1fr; }
      .count { display: none; }
    }
    @media (max-width: 470px) {
      .app { width: min(100% - 16px, 1180px); margin: 8px auto; }
      .panel { padding: 14px; border-radius: 12px; }
      .controls { grid-template-columns: 1fr; }
      .iterations { grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  .language-switch { display:flex; justify-content:flex-end; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .language-switch button { font-size:.85rem; }
    .language-switch button.active { background:var(--brand); color:#fff; }
  </style>
</head>
<body>
  <main class="app">
    <div class="language-switch" role="group" aria-label="Idioma" data-i18n-aria="language">
      <button type="button" data-lang="pt" lang="pt-BR" title="Português" aria-pressed="true" class="active">🇧🇷 Português</button>
      <button type="button" data-lang="es" lang="es" title="Español" aria-pressed="false">🇪🇸 Español</button>
      <button type="button" data-lang="en" lang="en" title="English" aria-pressed="false">🇺🇸 English</button>
    </div>
    <header>
      <h1><span data-i18n="heading">Escalonamento de laços com OpenMP</span></h1>
      <p class="subtitle"><span data-i18n="subtitleStart">Observe como as iterações de </span><code>0</code><span data-i18n="subtitleTo"> a </span><code>N − 1</code><span data-i18n="subtitleEnd"> são entregues às threads.</span></p>
    </header>

    <section class="panel" aria-label="Parâmetros da simulação" data-i18n-aria="parameters">
      <div class="controls">
        <label><span data-i18n="iterations">Número de iterações (N)
          </span><input id="iterationsInput" type="number" min="1" max="256" value="24">
        </label>
        <label><span data-i18n="threads">Número de threads
          </span><input id="threadsInput" type="number" min="1" max="32" value="4">
        </label>
        <label><span data-i18n="schedule">Escalonamento
          </span><select id="scheduleInput">
            <option value="default">DEFAULT</option>
            <option value="static" selected>STATIC</option>
            <option value="dynamic">DYNAMIC</option>
            <option value="guided">GUIDED</option>
          </select>
        </label>
        <label><span data-i18n="chunk">Chunk (vazio ou 1…N)
          </span><input id="chunkInput" type="number" min="1" max="24" placeholder="VAZIO" data-i18n-placeholder="empty">
        </label>
        <div class="actions">
          <button class="primary" id="playButton" type="button"><span data-i18n="play">▶ Animar</span></button>
          <button id="stepButton" type="button"><span data-i18n="step">Passo →</span></button>
          <button id="newRunButton" type="button"><span data-i18n="newRun">Nova execução</span></button>
        </div>
      </div>
      <div class="directive"><span class="pragma">#pragma omp parallel for</span> <span id="clauseText">schedule(static)</span><br>for (int i = 0; i &lt; N; i++) { <span data-i18n="work">trabalho</span>(i); }</div>
    </section>

    <section class="panel">
      <div class="status-row">
        <span id="uniquenessBadge" class="badge unique"><span data-i18n="unique">Distribuição única</span></span>
        <p id="explanation" class="explain"></p>
      </div>
      <div id="legend" class="legend" aria-label="Legenda das threads" data-i18n-aria="legend"></div>
      <div id="iterationsGrid" class="iterations" aria-label="Mapa das iterações" data-i18n-aria="map"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2><span data-i18n="perThread">Iterações por thread</span></h2>
        <span id="balanceText"></span>
      </div>
      <div id="lanes" class="lanes"></div>
      <p id="technicalNote" class="note"></p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";
      const translations = {
  "pt": {
    "title": "Simulador de Escalonamento OpenMP",
    "heading": "Escalonamento de laços com OpenMP",
    "subtitleStart": "Observe como as iterações de ",
    "subtitleTo": " a ",
    "subtitleEnd": " são entregues às threads.",
    "parameters": "Parâmetros da simulação",
    "iterations": "Número de iterações (N)",
    "threads": "Número de threads",
    "schedule": "Escalonamento",
    "chunk": "Chunk (vazio ou 1…N)",
    "empty": "VAZIO",
    "play": "▶ Animar",
    "stop": "■ Parar",
    "step": "Passo →",
    "newRun": "Nova execução",
    "unique": "Distribuição única",
    "variable": "Distribuição não única",
    "legend": "Legenda das threads",
    "map": "Mapa das iterações",
    "perThread": "Iterações por thread",
    "staticExplanation": "Cada thread recebe um bloco contíguo de tamanho aproximadamente igual.",
    "staticChunk": "Blocos de {0} iteração(ões) são distribuídos ciclicamente entre as threads.",
    "staticNote": "Para estes parâmetros, o mapeamento é determinístico. Com chunk vazio, o simulador usa a divisão contígua equilibrada adotada habitualmente; a norma permite alguma liberdade na divisão exata dos blocos.",
    "dynamicExplanation": "A próxima thread livre recebe um bloco de {0} iteração(ões).",
    "dynamicNote": "A distribuição não é única: tempos de execução e decisões do runtime alteram qual thread requisita o próximo chunk. “Nova execução” simula outra ordem de disponibilidade.",
    "guidedExplanation": "A próxima thread livre recebe máx({0}, ⌈iterações restantes ÷ {1} threads⌉).",
    "guidedNote": "A cada solicitação, o bloco é recalculado com o trabalho ainda não atribuído: tamanho = máx(CHUNK, ⌈restantes / threads⌉). Somente o último bloco pode ter menos que {0} iteração(ões). A thread destinatária depende da ordem de disponibilidade.",
    "defaultExplanation": "Sem cláusula schedule: o simulador usa STATIC sem chunk, mas a política real é escolhida pela implementação OpenMP.",
    "defaultNote": "Nesta visualização, DEFAULT produz exatamente a distribuição de schedule(static) com chunk vazio. Essa é uma escolha da implementação adotada pelo simulador, não uma garantia portátil: outro compilador ou runtime pode selecionar uma política diferente.",
    "thread": "Thread {0}",
    "iterationAria": "Iteração {0}, thread {1}",
    "balance": "carga: {0}–{1} iterações/thread",
    "work": "trabalho",
    "language": "Idioma"
  },
  "en": {
    "title": "OpenMP Scheduling Simulator",
    "heading": "Loop scheduling with OpenMP",
    "subtitleStart": "See how iterations from ",
    "subtitleTo": " to ",
    "subtitleEnd": " are assigned to threads.",
    "parameters": "Simulation parameters",
    "iterations": "Number of iterations (N)",
    "threads": "Number of threads",
    "schedule": "Scheduling",
    "chunk": "Chunk (empty or 1…N)",
    "empty": "EMPTY",
    "play": "▶ Animate",
    "stop": "■ Stop",
    "step": "Step →",
    "newRun": "New run",
    "unique": "Unique distribution",
    "variable": "Non-unique distribution",
    "legend": "Thread legend",
    "map": "Iteration map",
    "perThread": "Iterations per thread",
    "staticExplanation": "Each thread receives a contiguous block of approximately equal size.",
    "staticChunk": "Blocks of {0} iteration(s) are distributed cyclically among threads.",
    "staticNote": "For these parameters, the mapping is deterministic. With an empty chunk, the simulator uses the commonly adopted balanced contiguous partition; the standard allows some freedom in the exact division of blocks.",
    "dynamicExplanation": "The next available thread receives a block of {0} iteration(s).",
    "dynamicNote": "The distribution is not unique: execution times and runtime decisions affect which thread requests the next chunk. “New run” simulates a different order of availability.",
    "guidedExplanation": "The next available thread receives max({0}, ⌈remaining iterations ÷ {1} threads⌉).",
    "guidedNote": "On each request, the block is recalculated using the work not yet assigned: size = max(CHUNK, ⌈remaining / threads⌉). Only the last block may have fewer than {0} iteration(s). The receiving thread depends on the order of availability.",
    "defaultExplanation": "Without a schedule clause: the simulator uses STATIC without a chunk, but the actual policy is chosen by the OpenMP implementation.",
    "defaultNote": "In this visualization, DEFAULT produces exactly the distribution of schedule(static) with an empty chunk. This is an implementation choice adopted by the simulator, not a portable guarantee: another compiler or runtime may select a different policy.",

    "iterationAria": "Iteration {0}, thread {1}",
    "balance": "load: {0}–{1} iterations/thread",
    "work": "work",
    "language": "Language"
  },
  "es": {
    "title": "Simulador de Planificación OpenMP",
    "heading": "Planificación de bucles con OpenMP",
    "subtitleStart": "Observa cómo se asignan las iteraciones de ",
    "subtitleTo": " a ",
    "subtitleEnd": " a los hilos.",
    "parameters": "Parámetros de la simulación",
    "iterations": "Número de iteraciones (N)",
    "threads": "Número de hilos",
    "schedule": "Planificación",
    "chunk": "Chunk (vacío o 1…N)",
    "empty": "VACÍO",
    "play": "▶ Animar",
    "stop": "■ Detener",
    "step": "Paso →",
    "newRun": "Nueva ejecución",
    "unique": "Distribución única",
    "variable": "Distribución no única",
    "legend": "Leyenda de los hilos",
    "map": "Mapa de iteraciones",
    "perThread": "Iteraciones por hilo",
    "staticExplanation": "Cada hilo recibe un bloque contiguo de tamaño aproximadamente igual.",
    "staticChunk": "Los bloques de {0} iteración(es) se distribuyen cíclicamente entre los hilos.",
    "staticNote": "Para estos parámetros, la asignación es determinista. Con chunk vacío, el simulador usa la división contigua equilibrada habitual; la norma permite cierta libertad en la división exacta de los bloques.",
    "dynamicExplanation": "El siguiente hilo disponible recibe un bloque de {0} iteración(es).",
    "dynamicNote": "La distribución no es única: los tiempos de ejecución y las decisiones del runtime cambian qué hilo solicita el siguiente chunk. “Nueva ejecución” simula otro orden de disponibilidad.",
    "guidedExplanation": "El siguiente hilo disponible recibe máx({0}, ⌈iteraciones restantes ÷ {1} hilos⌉).",
    "guidedNote": "En cada solicitud, el bloque se recalcula con el trabajo aún no asignado: tamaño = máx(CHUNK, ⌈restantes / hilos⌉). Solo el último bloque puede tener menos de {0} iteración(es). El hilo destinatario depende del orden de disponibilidad.",
    "defaultExplanation": "Sin cláusula schedule: el simulador usa STATIC sin chunk, pero la política real la elige la implementación de OpenMP.",
    "defaultNote": "En esta visualización, DEFAULT produce exactamente la distribución de schedule(static) con chunk vacío. Es una elección de implementación adoptada por el simulador, no una garantía portable: otro compilador o runtime puede seleccionar una política diferente.",
    "thread": "Hilo {0}",
    "iterationAria": "Iteración {0}, hilo {1}",
    "balance": "carga: {0}–{1} iteraciones/hilo",
    "work": "trabajo",
    "language": "Idioma"
  }
};
      let lang = "pt";
      function translate(key, values = []) {
        return translations[lang][key].replace(/\{(\d+)\}/g, (_, index) => values[Number(index)]);
      }
      function applyLanguage() {
        document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
        document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = translate(el.dataset.i18n));
        document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", translate(el.dataset.i18nAria)));
        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => el.placeholder = translate(el.dataset.i18nPlaceholder));
        document.querySelectorAll("[data-lang]").forEach(button => {
          const active = button.dataset.lang === lang;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }
      document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click", () => {
        if (lang === button.dataset.lang) return;
        lang = button.dataset.lang;
        applyLanguage();
        render(false);
        $("playButton").textContent = translate(timer === null ? "play" : "stop");
      }));
      applyLanguage();
      const $ = (id) => document.getElementById(id);
      const controls = {
        n: $("iterationsInput"), threads: $("threadsInput"),
        schedule: $("scheduleInput"), chunk: $("chunkInput")
      };
      const colors = ["#2563eb", "#dc2626", "#059669", "#d97706", "#7c3aed", "#db2777", "#0891b2", "#ea580c",
        "#4f46e5", "#16a34a", "#be123c", "#0284c7", "#9333ea", "#65a30d", "#c2410c", "#0f766e"];
      let runSeed = 1, timer = null, visibleCount = Infinity, currentIndex = -1, assignment = [];

      function clampInt(value, min, max, fallback) {
        const parsed = Number.parseInt(value, 10);
        return Number.isFinite(parsed) ? Math.min(max, Math.max(min, parsed)) : fallback;
      }
      function params() {
        const n = clampInt(controls.n.value, 1, 256, 24);
        const threads = clampInt(controls.threads.value, 1, 32, 4);
        const rawChunk = controls.chunk.value.trim();
        const chunk = rawChunk === "" ? null : clampInt(rawChunk, 1, n, 1);
        controls.n.value = n; controls.threads.value = threads; controls.chunk.max = n;
        if (rawChunk !== "") controls.chunk.value = chunk;
        return { n, threads, schedule: controls.schedule.value, chunk };
      }
      function rng(seed) {
        let state = (seed * 0x9e3779b9) >>> 0;
        return () => {
          state = (state + 0x6d2b79f5) >>> 0;
          let value = state;
          value = Math.imul(value ^ (value >>> 15), value | 1);
          value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
          return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        };
      }
      function chunksOf(n, size) {
        const chunks = [];
        for (let start = 0; start < n; start += size) {
          chunks.push(Array.from({ length: Math.min(size, n - start) }, (_, k) => start + k));
        }
        return chunks;
      }
      function staticAssignment(n, threads, chunk) {
        const result = Array(n);
        if (chunk !== null) {
          chunksOf(n, chunk).forEach((part, index) => part.forEach(i => result[i] = index % threads));
        } else {
          const base = Math.floor(n / threads), remainder = n % threads;
          let cursor = 0;
          for (let t = 0; t < threads; t++) {
            const count = base + (t < remainder ? 1 : 0);
            for (let k = 0; k < count; k++) result[cursor++] = t;
          }
        }
        return result;
      }
      function queueAssignment(n, threads, schedule, chunk, seed) {
        const result = Array(n), random = rng(seed);
        // Cada execução simula diferenças independentes de partida, velocidade
        // das threads e custo das iterações. Assim, uma nova execução não é
        // apenas uma permutação dos identificadores das threads.
        const availableAt = Array.from({ length: threads }, () => random() * .35);
        const threadSpeed = Array.from({ length: threads }, () => .72 + random() * .65);
        let next = 0;
        while (next < n) {
          const t = availableAt.indexOf(Math.min(...availableAt));
          let size;
          if (schedule === "dynamic") size = chunk || 1;
          else {
            const remaining = n - next;
            size = Math.max(chunk || 1, Math.ceil(remaining / threads));
          }
          size = Math.min(size, n - next);
          for (let k = 0; k < size; k++) result[next + k] = t;
          const work = Array.from({ length: size }, () => .2 - Math.log(Math.max(1e-9, 1 - random())))
            .reduce((a, b) => a + b, 0) / threadSpeed[t];
          availableAt[t] += work + random() * .12;
          next += size;
        }
        return result;
      }
      function buildAssignment(p) {
        if (p.schedule === "static") return staticAssignment(p.n, p.threads, p.chunk);
        if (p.schedule === "default") return staticAssignment(p.n, p.threads, null);
        return queueAssignment(p.n, p.threads, p.schedule, p.chunk, runSeed);
      }
      function semantics(p) {
        if (p.schedule === "static") return {
          unique: true,
          explanation: p.chunk === null
            ? translate("staticExplanation")
            : `${translate("staticChunk", [p.chunk])}`,
          note: translate("staticNote")
        };
        if (p.schedule === "dynamic") return {
          unique: false,
          explanation: `${translate("dynamicExplanation", [p.chunk || 1])}`,
          note: translate("dynamicNote")
        };
        if (p.schedule === "guided") return {
          unique: false,
          explanation: `${translate("guidedExplanation", [p.chunk || 1,p.threads])}`,
          note: `${translate("guidedNote", [p.chunk || 1])}`
        };
        return {
          unique: true,
          explanation: translate("defaultExplanation"),
          note: translate("defaultNote")
        };
      }
      function stopAnimation() {
        if (timer !== null) window.clearInterval(timer);
        timer = null; $("playButton").textContent = translate("play");
      }
      function render(resetVisibility = true) {
        const p = params();
        controls.chunk.disabled = p.schedule === "default";
        if (p.schedule === "default") controls.chunk.value = "";
        if (resetVisibility) { visibleCount = p.n; currentIndex = -1; }
        assignment = buildAssignment(p);
        const info = semantics(p);
        const clause = p.schedule === "default" ? "" : `schedule(${p.schedule}${p.chunk === null ? "" : `, ${p.chunk}`})`;
        $("clauseText").textContent = clause;
        $("uniquenessBadge").textContent = info.unique ? translate("unique") : translate("variable");
        $("uniquenessBadge").className = `badge ${info.unique ? "unique" : "variable"}`;
        $("explanation").textContent = info.explanation;
        $("technicalNote").textContent = info.note;
        $("newRunButton").disabled = info.unique;

        $("legend").replaceChildren(...Array.from({ length: p.threads }, (_, t) => {
          const item = document.createElement("span"); item.className = "legend-item";
          item.innerHTML = `<span class="swatch" style="background:${colors[t % colors.length]}"></span>${translate("thread", [t])}`;
          return item;
        }));
        $("iterationsGrid").replaceChildren(...Array.from({ length: p.n }, (_, i) => {
          const cell = document.createElement("div");
          cell.className = `iteration${i >= visibleCount ? " pending" : ""}${i === currentIndex ? " current" : ""}`;
          cell.style.background = colors[assignment[i] % colors.length];
          cell.setAttribute("aria-label", `${translate("iterationAria", [i,assignment[i]])}`);
          cell.innerHTML = `<span>${i}</span><small>T${assignment[i]}</small>`;
          return cell;
        }));
        const perThread = Array.from({ length: p.threads }, () => []);
        assignment.forEach((thread, i) => perThread[thread].push(i));
        $("lanes").replaceChildren(...perThread.map((items, t) => {
          const lane = document.createElement("div"); lane.className = "lane";
          const visible = items.filter(i => i < visibleCount);
          lane.innerHTML = `<div class="thread"><span class="dot" style="background:${colors[t % colors.length]}"></span>${translate("thread", [t])}</div>
            <div class="lane-items">${visible.length ? visible.map(i => `<span class="chip" style="background:${colors[t % colors.length]}">${i}</span>`).join("") : '<span class="empty">—</span>'}</div>
            <div class="count">${items.length} iter.</div>`;
          return lane;
        }));
        const counts = perThread.map(x => x.length);
        $("balanceText").textContent = `${translate("balance", [Math.min(...counts),Math.max(...counts)])}`;
      }
      function animate() {
        const p = params();
        stopAnimation(); visibleCount = 0; currentIndex = -1; render(false);
        $("playButton").textContent = translate("stop");
        timer = window.setInterval(() => {
          visibleCount++;
          currentIndex = visibleCount - 1;
          render(false);
          if (visibleCount >= p.n) { stopAnimation(); currentIndex = -1; render(false); }
          else $("playButton").textContent = translate("stop");
        }, Math.max(55, Math.min(220, 2600 / p.n)));
      }
      function stepOnce() {
        stopAnimation();
        const p = params();
        if (visibleCount >= p.n) visibleCount = 0;
        visibleCount++;
        currentIndex = visibleCount - 1;
        render(false);
      }
      Object.values(controls).forEach(control => control.addEventListener("change", () => { stopAnimation(); render(true); }));
      $("playButton").addEventListener("click", () => timer === null ? animate() : (stopAnimation(), currentIndex = -1, render(false)));
      $("stepButton").addEventListener("click", stepOnce);
      $("newRunButton").addEventListener("click", () => { stopAnimation(); runSeed++; render(true); });
      render(true);
    })();
  </script>
</body>
</html>
